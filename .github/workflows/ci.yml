# Type-checks the frontend and runs the Rust unit tests (CPU build) on pushes to
# main and on pull requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            libasound2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Test the release portability check
        run: node --test .github/verify-portable-ggml.test.cjs

      - name: Type-check the frontend
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit

      - name: Rust unit tests
        working-directory: frontend/src-tauri
        run: |
          # tauri-build requires every bundled sidecar to exist; tests never start it
          mkdir -p binaries
          touch binaries/trinote-llama-helper-x86_64-unknown-linux-gnu
          cargo test --lib
