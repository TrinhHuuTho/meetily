# Builds the Linux packages (.deb and AppImage) with the Vulkan GPU backend.
# Pushing a tag like v1.0.0 creates a draft GitHub release with the packages and
# SHA256SUMS attached; running it by hand only uploads the packages as an artifact.
# Ubuntu 22.04 is used on purpose: packages built against its libraries also run on
# newer Ubuntu releases, but not the other way round.
name: Release (Linux)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      # Do not tune native code for the CI machine's CPU: whisper-rs-sys forwards
      # CMAKE_* variables, and this hook forces GGML_NATIVE=OFF (AVX2 baseline).
      # llama-cpp-sys-2 disables GGML_NATIVE by itself.
      CMAKE_PROJECT_INCLUDE: ${{ github.workspace }}/.github/force-portable-ggml.cmake
      RUSTFLAGS: -C target-cpu=x86-64-v2
      # linuxdeploy's strip cannot handle newer ELF sections
      NO_STRIP: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file pkg-config cmake clang \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev libxdo-dev \
            libasound2-dev patchelf libfuse2

      - name: Install the Vulkan SDK (glslc is not packaged for Ubuntu 22.04)
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-1.3.290-jammy.list \
            https://packages.lunarg.com/vulkan/1.3.290/lunarg-vulkan-1.3.290-jammy.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      # Cache downloaded crates only: release binaries are always built from scratch,
      # so no build from an older run (or with other flags) can end up in a package
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build llama-helper (Vulkan)
        run: |
          cargo build --release -p llama-helper --features vulkan
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper frontend/src-tauri/binaries/llama-helper-x86_64-unknown-linux-gnu

      - name: Build TriNote (Vulkan)
        working-directory: frontend
        run: pnpm tauri build --bundles deb,appimage --features vulkan

      - name: Check that Whisper was built without CPU-specific instructions
        run: node .github/verify-portable-ggml.cjs target/release

      - name: Name the Debian package "trinote"
        run: bash .github/scripts/rename-deb-package.sh target/release/bundle/deb/*.deb

      - name: Collect packages and checksums
        run: |
          mkdir -p dist
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage dist/
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: trinote-linux-x86_64
          path: dist/*

      - name: Write release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Linux packages for x86_64 (Ubuntu 22.04 or newer, CPU with AVX2)."
            echo "Install with \`sudo apt install ./<file>.deb\`, or make the AppImage executable and run it."
            echo "Check downloads against \`SHA256SUMS\`."
            echo
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[[^]]+\]: / { next }
              found { print }
            ' CHANGELOG.md
          } > release-notes.md
          cat release-notes.md

      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: TriNote ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
